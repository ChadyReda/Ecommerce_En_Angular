<article class="min-w-70 hover:transform hover:-translate-y-2 relative transition-all hover:bg-yellow-50 cursor-pointer border-3 max-w-[16rem] border-gray-500 gap-y-3 flex flex-col items-center justify-center p-4 rounded-sm m-4">
    <span class="absolute top-2 left-2 text-yellow-500">{{item().rarety}}</span>
    <figure class="w-full h-56 flex items-center justify-center overflow-hidden mt-2">
        <img src={{item().image}} alt="Collection Item" class="max-w-full max-h-full object-contain" />
    </figure>
    <header class="flex flex-col items-center justify-center">
        <h2 class="text-2xl font-bold">{{item().name}}</h2>
        <p class="text-gray-600">{{item().type}}</p>
    </header>
    <footer>
        <p>
            <span class="text-gray-600">Prix:</span>
            <span class="font-bold">${{item().price}}</span>
        </p>
    </footer>
</article>
