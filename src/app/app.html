<main class="flex flex-col items-center">
  <div class="flex flex-col items-center m-5">
    <h1 class="text-3xl font-bold">Pokemon</h1>
    <app-search-bar (submit)="incrementCount()" [(search)] = "searchText"></app-search-bar>
    <p>Clicks Count: {{clicksCount}}</p>
    <p>Search Query: {{searchText}}</p>
  </div>
  <div class="flex flex-wrap justify-center">
    <app-collection-item-card [item] = "selectedItem()"></app-collection-item-card>
  </div>
  <button (click) = "incrementIndex()" class="bg-green-500 text-white px-4 rounded hover:bg-green-600 cursor-pointer">Toggle</button>
</main>
